</div>

<img class="w-full h-auto drop-shadow-2xl" data-alt="A clean, modern travel-inspired vector illustration in a minimalist editorial style. A cheerful traveler with a minimalist backpack and a digital map tablet is walking towards glowing abstract destination peaks. The color palette features deep navy blue, soft teal, and vibrant saffron accents against a light cream background, evoking a sense of calm excitement and sophisticated adventure." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCMCr-zPizYqLaMYgRnQ-ibRBBZojCgOy97MrxSf6WPdZ52ExdH_zwETPjEXTNSAzSjsOFbuWko2F0pMOslgkc9dV9c4jbd__6BzTnFhwQ1zU2zc3-q2AErFZjRVqacrPg1HyH6yCG5vEZNGISHIjqvKvZ-IaorZeyTG3VQAwuIf9xqfNgFpyCYXbnVS9tAz6GkbZ0KjNdmzHx4ZJ7aZ6qSS3QlehQ1-VibvOSb6Ptmna0nJX1DPP_Fid83lPfz6x5y_ERRc46dO7J9"/>

</div>
</div>
<span class="text-label-sm font-label-sm text-on-primary-container">Join 20k+ fellow travelers</span>
</div>
</div>
</section>
<!-- Right Side: Form Content -->
<section class="flex-1 p-8 lg:p-16 flex flex-col justify-center bg-surface-container-lowest">
<div class="max-w-[400px] mx-auto w-full">
<!-- Toggle Header -->
<div class="flex justify-between items-end mb-10">
<div>
<h2 class="font-headline-md text-headline-md text-primary" id="form-title">Welcome back</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1" id="form-subtitle">Please enter your details.</p>
</div>
</div>
<!-- Form Toggle Switch -->
<div class="bg-surface-container-low p-1 rounded-lg flex mb-8">
<button class="flex-1 py-2 text-label-sm font-label-sm rounded-md bg-surface-container-lowest shadow-sm text-primary transition-all duration-300" id="toggle-signin" onclick="switchForm('signin')">Sign in</button>
<button class="flex-1 py-2 text-label-sm font-label-sm rounded-md text-on-surface-variant hover:text-primary transition-all duration-300" id="toggle-signup" onclick="switchForm('signup')">Create account</button>
</div>
<!-- Google Login -->
<button class="w-full py-3 px-4 border border-outline-variant rounded-xl flex items-center justify-center gap-3 font-label-sm text-label-sm text-on-surface hover:bg-surface-container-low transition-colors duration-200 mb-6">
<svg fill="none" height="20" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>

<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Continue with Google
                </button>
<div class="relative flex items-center mb-8">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 text-label-sm font-label-sm text-outline">or</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Form Fields -->
<form class="space-y-5" id="auth-form" onsubmit="event.preventDefault()">
<div class="hidden" id="name-field-container">
<label class="block text-label-sm font-label-sm text-on-surface-variant mb-1.5" for="name">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border-transparent focus:border-primary focus:ring-1 focus:ring-primary rounded-xl text-body-md transition-all" id="name" name="name" placeholder="Enter your full name" type="text"/>
</div>
</div>
<div>
<label class="block text-label-sm font-label-sm text-on-surface-variant mb-1.5" for="email">Email address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border-transparent focus:border-primary focus:ring-1 focus:ring-primary rounded-xl text-body-md transition-all" id="email" name="email" placeholder="you@example.com" type="email"/>
</div>
</div>
<div>
<div class="flex justify-between items-center mb-1.5">
<label class="block text-label-sm font-label-sm text-on-surface-variant" for="password">Password</label>
<a class="text-label-sm font-label-sm text-primary hover:underline" href="#" id="forgot-link">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full pl-10 pr-10 py-3 bg-surface-container-low border-transparent focus:border-primary focus:ring-1 focus:ring-primary rounded-xl text-body-md transition-all" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<button class="w-full py-4 bg-primary text-on-primary rounded-xl font-label-sm text-label-sm hover:bg-primary/90 active:scale-[0.98] transition-all duration-200 mt-4 shadow-lg shadow-primary/10" id="submit-btn" type="submit">
                        Sign in
                    </button>
</form>
<p class="mt-8 text-center text-label-sm font-label-sm text-on-surface-variant">
                    By continuing, you agree to our <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
                </p>
</div>
</section>
</main>
<footer class="mt-8 mb-4 px-margin-mobile text-center">
<p class="text-label-sm font-label-sm text-outline">© 2024 Balaji Holidays. All rights reserved.</p>
</footer>
<script>
        function switchForm(mode) {
            const title = document.getElementById('form-title');
            const subtitle = document.getElementById('form-subtitle');
            const submitBtn = document.getElementById('submit-btn');
            const nameField = document.getElementById('name-field-container');
            const forgotLink = document.getElementById('forgot-link');
            
            const btnSignin = document.getElementById('toggle-signin');
            const btnSignup = document.getElementById('toggle-signup');

            if (mode === 'signup') {
                title.innerText = 'Create an account';
                subtitle.innerText = 'Start your holiday planning today.';
                submitBtn.innerText = 'Create account';
                nameField.classList.remove('hidden');
                forgotLink.classList.add('hidden');
                
                btnSignup.classList.add('bg-surface-container-lowest', 'shadow-sm', 'text-primary');
                btnSignup.classList.remove('text-on-surface-variant');
                btnSignin.classList.remove('bg-surface-container-lowest', 'shadow-sm', 'text-primary');
                btnSignin.classList.add('text-on-surface-variant');
            } else {
                title.innerText = 'Welcome back';
                subtitle.innerText = 'Please enter your details.';
                submitBtn.innerText = 'Sign in';
                nameField.classList.add('hidden');
                forgotLink.classList.remove('hidden');

                btnSignin.classList.add('bg-surface-container-lowest', 'shadow-sm', 'text-primary');
                btnSignin.classList.remove('text-on-surface-variant');
                btnSignup.classList.remove('bg-surface-container-lowest', 'shadow-sm', 'text-primary');
                btnSignup.classList.add('text-on-surface-variant');
            }
        }

        // Simple interaction for the visibility toggle
        document.querySelector('button[type="button"]').addEventListener('click', function() {
            const input = document.getElementById('password');
            const icon = this.querySelector('span');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        });
    </script>
